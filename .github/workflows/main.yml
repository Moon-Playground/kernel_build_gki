name: Build Kernel

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      MANIFEST_REPO:
        description: "Manifest url"
        required: true
        default: "git@github.com:Mayuri-Chan/android_kernel_xiaomi_gale_manifest.git"
      MANIFEST_BRANCH:
        description: "Manifest branch"
        required: true
        default: "lineage-24.0"
      DEVICE:
        description: "Target Device"
        required: true
        default: "mgk_64_k66"
      LIST_REPO:
        description: "Repo contains module lists"
        required: true
        default: "git@github.com:xiaomi-gale/android_device_xiaomi_gale-kernels.git"
      LIST_BRANCH:
        description: "List repo branch"
        required: true
        default: "lineage-24.0"

jobs:
  build_kernel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Free Disk Space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Install Dependencies
        run: |
          sudo apt update -y
          sudo apt install rsync bc cpio flex bison aptitude aria2 git python-is-python3 tar perl wget curl lz4 ccache -y
          sudo aptitude install libssl-dev -y

      - name: Setup Build Environment
        run: |
          mkdir -p "$HOME/.bin"
          curl https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/.bin/repo"
          chmod +x "$HOME/.bin/repo"
          echo "$HOME/.bin" >> $GITHUB_PATH
          mkdir -p "$GITHUB_WORKSPACE/kernel"
          git config --global user.name "wulan17"
          git config --global user.email "wulan17@wulan17.my.id"

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
            chmod 600 ~/.ssh/id_deploy

            cat << 'EOF' >> ~/.ssh/config
          Host github.com
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking accept-new
          EOF
          fi

      - name: Initialize Kernel Source
        run: |
          cd "$GITHUB_WORKSPACE/kernel"
          repo init -u "${{ inputs.MANIFEST_REPO }}" -b "${{ inputs.MANIFEST_BRANCH }}" --depth=1

      - name: Sync Sources
        run: |
            cd "$GITHUB_WORKSPACE/kernel"
            repo sync -c -j$(nproc --all) --no-clone-bundle --no-tags --optimized-fetch --force-sync --prune

      - name: Apply LRNG patches
        run: |
            git -C kernel/kernel-6.6 apply "$GITHUB_WORKSPACE"/patches/lrng/*.patch || return 1

      - name: Apply BBRv3 patches
        run: |
            git -C kernel/kernel-6.6 apply "$GITHUB_WORKSPACE"/patches/bbrv3/*.patch || return 1

      - name: Setup BakaSU
        run: |
            cd "$GITHUB_WORKSPACE/kernel/kernel-6.6"
            git apply "$GITHUB_WORKSPACE"/patches/bakasu/*.patch || return 1
            curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash
            KSU_REAL="$GITHUB_WORKSPACE/kernel/kernel-6.6/KernelSU/kernel"
            sed -i 's|^LOCAL_GIT_EXISTS := .*|LOCAL_GIT_EXISTS := 1|' "$KSU_REAL/Kbuild"
            sed -i "s|cd \$(KSU_SRC);|cd $KSU_REAL;|g" "$KSU_REAL/Kbuild"

            # fail fast if the edit didn't land
            grep -n 'LOCAL_GIT_EXISTS :=\|cd /home' "$KSU_REAL/Kbuild"
            test -e "$KSU_REAL/../.git"

      - name: Setup defconfig
        run: |
            P=kernel/kernel_device_modules-6.6
            F=$P/mayuri.fragment
            echo "CONFIG_KSU=y" > $F
            echo "# CONFIG_KSU_TRACEPOINT_HOOK is not set" >> $F
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> $F
            echo "CONFIG_TCP_CONG_BBR3=y" >> $F
            echo "CONFIG_DEFAULT_BBR3=y" >> $F
            echo 'CONFIG_DEFAULT_TCP_CONG="bbr3"' >> $F
            echo 'exports_files(["mayuri.fragment"], visibility = ["//visibility:public"])' >> $P/BUILD.bazel
            sed -i 's|--noenable_bzlmod \\|--noenable_bzlmod --defconfig_fragment=//kernel_device_modules-6.6:mayuri.fragment \\|' $P/build.sh
            grep -n "defconfig_fragment" $P/build.sh

      - name: Clean dirty flags
        run: |
            cd "$GITHUB_WORKSPACE/kernel/kernel-6.6/KernelSU"
            git add --all && git commit --amend --no-edit

      - name: Build Kernel
        run: |
            cd "$GITHUB_WORKSPACE/kernel"
            ./build_${{ inputs.DEVICE }}.sh

      - name: Prepare artifacts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist/kernel"
          cp "$GITHUB_WORKSPACE"/kernel/out/${{ inputs.DEVICE }}/dist/Image.gz "$GITHUB_WORKSPACE"/dist/kernel/
          cp "$GITHUB_WORKSPACE"/kernel/out/${{ inputs.DEVICE }}/dist/*dtb* "$GITHUB_WORKSPACE"/dist/kernel/
          git clone ${{ inputs.LIST_REPO }} -b ${{ inputs.LIST_BRANCH }} "$GITHUB_WORKSPACE"/kernels
          python sort.py $GITHUB_WORKSPACE/kernel/out/${{ inputs.DEVICE }}/dist

      - name: Upload kernel
        uses: actions/upload-artifact@v7
        with:
          name: kernel
          path: "dist/kernel"

      - name: Upload system_dlkm
        uses: actions/upload-artifact@v7
        with:
          name: system_dlkm
          path: "dist/system_dlkm"

      - name: Upload vendor_dlkm
        uses: actions/upload-artifact@v7
        with:
          name: vendor_dlkm
          path: "dist/vendor_dlkm"

      - name: Upload vendor_ramdisk
        uses: actions/upload-artifact@v7
        with:
          name: vendor_ramdisk
          path: "dist/vendor_ramdisk"

      - name: Upload misc_modules
        uses: actions/upload-artifact@v7
        with:
          name: misc_modules
          path: "dist/misc"
