name: Build Kernel

permissions:
  contents: write

on:
  workflow_dispatch:


jobs:
  build_kernel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false

      - name: Install LLD
        run: sudo apt update && sudo apt install -y -qq lld binutils

      - name: Setup Build Environment
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod +x ~/.bin/repo
          mkdir -p "$GITHUB_WORKSPACE/common"

      - name: Initialize Kernel Source
        run: |
          cd "$GITHUB_WORKSPACE/common"
          ~/.bin/repo init -u https://android.googlesource.com/kernel/manifest -b "common-android15-6.6-2025-06" --depth=1
          mkdir -p .repo/local_manifests
          cp "$GITHUB_WORKSPACE"/mtk.xml .repo/local_manifests/

      - name: Sync Sources
        run: |
            cd "$GITHUB_WORKSPACE/common"
            ~/.bin/repo sync -c -j$(nproc --all) --no-clone-bundle --no-tags --optimized-fetch --force-sync --prune
  
      - name: Clean Dirty Flags
        run: |
            cd "$GITHUB_WORKSPACE/common"
            sed -i "/stable_scmversion_cmd/s/-maybe-dirty//g" build/kernel/kleaf/impl/stamp.bzl
            sed -i 's/-dirty//' common/scripts/setlocalversion

      - name: Build Kernel
        run: |
            cd "$GITHUB_WORKSPACE/common"
            tools/bazel build --config=fast --lto=thin //common:kernel_aarch64_dist

      - name: Prepare artifacts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$GITHUB_WORKSPACE/common/bazel-bin/common/kernel_aarch64/Image" "$GITHUB_WORKSPACE/dist/Image.gz"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kernel
          path: "dist"
